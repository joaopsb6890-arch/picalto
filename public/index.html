<style>
/* ===== Design tokens (Picalta) ===== */
:root,
[data-theme='light'] {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;

  --color-bg: #faf7f2;
  --color-surface: #ffffff;
  --color-surface-offset: #f1ece4;
  --color-divider: #e6e0d6;
  --color-border: #d9d2c4;
  --color-text: #1f1a15;
  --color-text-muted: #6b6259;
  --color-text-faint: #a79c8e;
  --color-primary: #672ea4;
  --color-primary-hover: #53247f;
  --color-primary-highlight: #e9def8;
  --color-accent: #c2185b;
  --color-accent-highlight: #f7d9e4;
  --color-like: #e91e63;

  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px rgba(31, 26, 21, 0.06);
  --shadow-md: 0 4px 12px rgba(31, 26, 21, 0.08);
  --shadow-lg: 0 12px 32px rgba(31, 26, 21, 0.12);
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);

  --font-display: 'Instrument Serif', Georgia, serif;
  --font-body: 'Work Sans', 'Helvetica Neue', sans-serif;

  --content-feed: 640px;
  --content-app: 1080px;
}
[data-theme='dark'] {
  --color-bg: #16120e;
  --color-surface: #1e1915;
  --color-surface-offset: #2a241e;
  --color-divider: #2e2822;
  --color-border: #443c33;
  --color-text: #e8e2d8;
  --color-text-muted: #9a9184;
  --color-text-faint: #6b6155;
  --color-primary: #a97ce8;
  --color-primary-hover: #8a5bd0;
  --color-primary-highlight: #3a2c50;
  --color-accent: #e86a9a;
  --color-accent-highlight: #4a2c36;
  --color-like: #ff5c8a;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; }
body {
  min-height: 100dvh;
  line-height: 1.6;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background-color: var(--color-bg);
}
img, svg, video { display: block; max-width: 100%; height: auto; }
input, button, textarea, select { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; line-height: 1.15; }
p, li, figcaption { text-wrap: pretty; max-width: 72ch; }
::selection { background: color-mix(in oklab, var(--color-primary) 25%, transparent); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
button { cursor: pointer; background: none; border: none; }
a, button, [role='button'], input, textarea, select {
  transition: color var(--transition-interactive), background var(--transition-interactive),
    border-color var(--transition-interactive), box-shadow var(--transition-interactive);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ===== Logotipo ===== */
.logo { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--color-text); text-decoration: none; }
.logo svg { flex: none; }
.logo-text { font-family: var(--font-display); font-size: var(--text-lg); letter-spacing: 0.01em; }
.logo-text em { font-style: italic; color: var(--color-primary); }

/* ===== Estrutura da app ===== */
.app { display: grid; grid-template-columns: 1fr; min-height: 100dvh; }
@media (min-width: 900px) { .app { grid-template-columns: 240px 1fr; } }
.sidebar {
  position: sticky; top: 0; height: 100dvh;
  display: none; flex-direction: column;
  padding: var(--space-6);
  border-right: 1px solid var(--color-divider);
  background: var(--color-surface);
  z-index: 20;
}
@media (min-width: 900px) { .sidebar { display: flex; } }
.sidebar .logo { margin-bottom: var(--space-8); }
.nav { display: flex; flex-direction: column; gap: var(--space-1); }
.nav a {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  color: var(--color-text); text-decoration: none; font-size: var(--text-sm); font-weight: 500;
}
.nav a:hover { background: var(--color-surface-offset); }
.nav a.active { background: var(--color-primary-highlight); color: var(--color-primary-hover); font-weight: 700; }
.sidebar-footer { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-6); }
.theme-toggle { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border-radius: var(--radius-md); color: var(--color-text-muted); font-size: var(--text-sm); }
.theme-toggle:hover { background: var(--color-surface-offset); }

/* barra inferior no telemóvel */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
  display: flex; justify-content: space-around;
  background: var(--color-surface);
  border-top: 1px solid var(--color-divider);
  padding: var(--space-2) var(--space-4) calc(var(--space-2) + env(safe-area-inset-bottom, 0px));
}
.tabbar button {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--color-text-muted); font-size: var(--text-xs); padding: var(--space-1) var(--space-1);
  border-radius: var(--radius-md);
  flex: 0 0 auto;
}
.tabbar { overflow-x: auto; justify-content: space-between; gap: 0; padding-left: var(--space-2); padding-right: var(--space-2); }
.tabbar button.active { color: var(--color-primary); font-weight: 700; }
@media (min-width: 900px) { .tabbar { display: none; } }

/* ===== Viewport ===== */
.viewport { max-width: var(--content-app); margin: 0 auto; padding: var(--space-6) var(--space-4) calc(var(--space-16) + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) { .viewport { padding: var(--space-8) var(--space-8); } }
.view { display: none; }
.view.active { display: block; }

.page-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
.page-head.mobile-only { display: flex; }
@media (min-width: 900px) { .page-head.mobile-only { display: none; } }
.page-title { font-family: var(--font-display); font-size: var(--text-xl); }
.page-head .actions { display: flex; gap: var(--space-2); align-items: center; }

/* ===== Botões ===== */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-full);
  background: var(--color-primary); color: #fff;
  font-size: var(--text-sm); font-weight: 600; text-decoration: none;
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: var(--color-primary-hover); }
.btn.ghost { background: transparent; color: var(--color-primary); box-shadow: none; }
.btn.ghost:hover { background: var(--color-primary-highlight); }
.btn.danger { background: var(--color-accent); }
.btn.danger:hover { background: var(--color-accent-highlight); color: var(--color-text); }
.btn.small { padding: var(--space-1) var(--space-3); font-size: var(--text-xs); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--radius-full);
  color: var(--color-text-muted);
}
.icon-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ===== Barra "Pessoas" (stories) ===== */
.people-bar { display: flex; gap: var(--space-4); overflow-x: auto; padding-bottom: var(--space-4); scrollbar-width: none; }
.people-bar::-webkit-scrollbar { display: none; }
.person-chip {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  flex: none; width: 84px; text-align: center; background: none;
}
.person-ring {
  width: 64px; height: 64px; border-radius: var(--radius-full);
  display: grid; place-items: center;
  background: conic-gradient(var(--color-primary), var(--color-accent), var(--color-primary));
  padding: 2.5px;
}
.person-chip.me .person-ring { background: conic-gradient(var(--color-divider), var(--color-divider)); }
.person-ring .inner {
  width: 100%; height: 100%; border-radius: var(--radius-full);
  background: var(--color-surface); display: grid; place-items: center;
  padding: 3px;
}
.person-ring .inner img, .person-ring .inner .avatar-fallback {
  width: 100%; height: 100%; border-radius: var(--radius-full); object-fit: cover;
}
.person-name { font-size: var(--text-xs); color: var(--color-text-muted); max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
.person-chip.has-story .person-ring { background: conic-gradient(var(--color-accent), var(--color-primary), var(--color-accent)); }

/* ===== Cartão de publicação ===== */
.feed { display: flex; flex-direction: column; gap: var(--space-8); max-width: var(--content-feed); margin: 0 auto; }
.post {
  background: var(--color-surface);
  border: 1px solid var(--color-divider);
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.post-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); }
.avatar, .avatar-fallback {
  width: 40px; height: 40px; border-radius: var(--radius-full); flex: none;
  object-fit: cover; display: grid; place-items: center;
  color: #fff; font-weight: 700; font-size: var(--text-sm);
  background: var(--color-primary);
}
.post-user { display: flex; flex-direction: column; line-height: 1.25; }
.post-user a { color: var(--color-text); text-decoration: none; font-weight: 700; font-size: var(--text-sm); }
.post-user a:hover { color: var(--color-primary); }
.post-user span { font-size: var(--text-xs); color: var(--color-text-faint); }
.post-image { width: 100%; aspect-ratio: 4/5; object-fit: cover; background: var(--color-surface-offset); }
.post-actions { display: flex; gap: var(--space-1); padding: var(--space-3) var(--space-4) 0; align-items: center; }
.like-btn { color: var(--color-text-muted); }
.like-btn.liked { color: var(--color-like); }
.like-btn.liked svg { fill: currentColor; }
.likes-count { font-size: var(--text-sm); font-weight: 700; margin-left: var(--space-2); }
.post-meta { padding: var(--space-2) var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.post-caption { font-size: var(--text-sm); }
.post-caption b { font-weight: 700; }
.comments-list { display: flex; flex-direction: column; gap: var(--space-1); padding: 0 var(--space-4); }
.comment { font-size: var(--text-sm); }
.comment b { font-weight: 700; }
.comment-form { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); }
.comment-form input {
  flex: 1; padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-border); border-radius: var(--radius-full);
  background: var(--color-surface-offset); font-size: var(--text-sm);
}
.comment-form input:focus { outline: 2px solid var(--color-primary); outline-offset: 0; }
.comment-form button { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); background: var(--color-primary); color: #fff; font-size: var(--text-sm); font-weight: 600; }
.delete-post { color: var(--color-text-faint); }
.delete-post:hover { color: var(--color-accent); }

/* ===== Nova publicação (modal) ===== */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(15, 12, 9, 0.6);
  display: grid; place-items: center; padding: var(--space-4);
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--color-surface);
  border-radius: var(--radius-xl);
  width: min(480px, 100%);
  max-height: 90dvh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  padding: var(--space-6);
  display: flex; flex-direction: column; gap: var(--space-4);
}
.modal h2 { font-family: var(--font-display); font-size: var(--text-lg); }
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field label { font-size: var(--text-sm); font-weight: 600; }
.field input[type='text'], .field input[type='email'], .field input[type='password'], .field textarea {
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border); border-radius: var(--radius-md);
  background: var(--color-surface-offset); font-size: var(--text-sm);
}
.field textarea { resize: vertical; min-height: 80px; }
.file-drop {
  border: 2px dashed var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-8); text-align: center; font-size: var(--text-sm); color: var(--color-text-muted);
  cursor: pointer;
}
.file-drop:hover { border-color: var(--color-primary); color: var(--color-primary); }
.file-drop img { margin: 0 auto var(--space-3); max-height: 240px; border-radius: var(--radius-md); }
.modal-actions { display: flex; justify-content: flex-end; gap: var(--space-2); }

/* ===== Conversas ===== */
.chat-layout { display: grid; grid-template-columns: 1fr; gap: var(--space-4); }
@media (min-width: 900px) { .chat-layout { grid-template-columns: 320px 1fr; } }
@media (max-width: 899px) {
  .chat-layout.has-open-chat .chat-list { display: none; }
  .chat-layout.has-open-chat .chat-window { height: calc(100dvh - 180px); }
}
.chat-list { display: flex; flex-direction: column; gap: var(--space-2); }
.chat-card {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg); text-align: left; width: 100%;
}
.chat-card:hover, .chat-card.active { border-color: var(--color-primary); background: var(--color-primary-highlight); }
.chat-card .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.chat-card .meta b { font-size: var(--text-sm); }
.chat-card .meta span { font-size: var(--text-xs); color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-window { display: none; flex-direction: column; height: 70dvh; background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-xl); overflow: hidden; }
.chat-window.active { display: flex; }
.chat-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-divider); }
.chat-head .avatar, .chat-head .avatar-fallback { width: 32px; height: 32px; font-size: var(--text-xs); }
.chat-head b { font-size: var(--text-sm); }
.chat-messages { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); }
.bubble {
  max-width: 75%; padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-lg); font-size: var(--text-sm); line-height: 1.45;
  word-wrap: break-word;
}
.bubble.mine { align-self: flex-end; background: var(--color-primary); color: #fff; border-bottom-right-radius: var(--radius-sm); }
.bubble.theirs { align-self: flex-start; background: var(--color-surface-offset); border-bottom-left-radius: var(--radius-sm); }
.bubble .time { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }
.typing-indicator { font-size: var(--text-xs); color: var(--color-text-faint); padding: 0 var(--space-4); height: 20px; }
.chat-input { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-divider); }
.chat-input input {
  flex: 1; padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-border); border-radius: var(--radius-full);
  background: var(--color-surface-offset); font-size: var(--text-sm);
}
.chat-input input:focus { outline: 2px solid var(--color-primary); outline-offset: 0; }
.chat-input button { padding: var(--space-2) var(--space-4); border-radius: var(--radius-full); background: var(--color-primary); color: #fff; font-size: var(--text-sm); font-weight: 600; }

/* ===== Perfil ===== */
.profile-head { display: flex; align-items: center; gap: var(--space-6); margin-bottom: var(--space-6); }
.profile-head .avatar, .profile-head .avatar-fallback { width: 80px; height: 80px; font-size: var(--text-lg); }
.profile-stats { display: flex; gap: var(--space-6); }
.profile-stats div { text-align: center; }
.profile-stats b { display: block; font-size: var(--text-lg); }
.profile-stats span { font-size: var(--text-xs); color: var(--color-text-muted); }
.profile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
.profile-grid img { aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-md); width: 100%; }
.profile-grid button { padding: 0; border-radius: var(--radius-md); overflow: hidden; }
.profile-grid button:hover img { opacity: 0.85; }

/* ===== Pesquisa ===== */
.search-bar { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); }
.search-bar input {
  flex: 1; padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-border); border-radius: var(--radius-full);
  background: var(--color-surface-offset); font-size: var(--text-sm);
}
.search-bar input:focus { outline: 2px solid var(--color-primary); outline-offset: 0; }
.search-results { display: flex; flex-direction: column; gap: var(--space-2); }
.search-result {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg);
}
.search-result .meta { flex: 1; }
.search-result .meta b { font-size: var(--text-sm); }
.search-result .meta span { display: block; font-size: var(--text-xs); color: var(--color-text-muted); }

.suggestions-list { display: flex; flex-direction: column; gap: var(--space-2); }
.suggestion-card {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface); border: 1px solid var(--color-divider);
  border-radius: var(--radius-lg);
}
.suggestion-card > div { flex: 1; }
.suggestion-card > div b { font-size: var(--text-sm); }
.suggestion-card > div span { display: block; font-size: var(--text-xs); color: var(--color-text-muted); }

/* ===== Login / Signup ===== */
.login-hero {
  min-height: 100dvh; display: grid; place-items: center; padding: var(--space-6);
  background:
    radial-gradient(1200px 600px at 10% -10%, color-mix(in oklab, var(--color-primary) 18%, transparent), transparent),
    radial-gradient(900px 500px at 110% 110%, color-mix(in oklab, var(--color-accent) 16%, transparent), transparent),
    var(--color-bg);
}
.login-card {
  width: min(420px, 100%); background: var(--color-surface);
  border-radius: var(--radius-xl); padding: var(--space-10);
  box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: var(--space-4);
}
.login-card .logo { justify-content: center; margin-bottom: var(--space-2); }
.login-card .logo-text { font-size: var(--text-xl); }
.login-tag { text-align: center; color: var(--color-text-muted); font-size: var(--text-sm); }
.login-error { color: var(--color-accent); font-size: var(--text-sm); text-align: center; min-height: 1.2em; }
.login-switch { text-align: center; font-size: var(--text-sm); }
.login-switch button { color: var(--color-primary); font-weight: 600; }

/* estado vazio */
.empty { text-align: center; color: var(--color-text-muted); padding: var(--space-12) 0; }
.empty svg { margin: 0 auto var(--space-4); color: var(--color-text-faint); }

/* notificações (in-app) */
.notifications-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(320px, 90vw);
  background: var(--color-surface); border-left: 1px solid var(--color-divider);
  z-index: 90; padding: var(--space-6); overflow-y: auto;
  transform: translateX(100%); transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
}
.notifications-panel.open { transform: translateX(0); }
.notif-item { padding: var(--space-3) 0; border-bottom: 1px solid var(--color-divider); font-size: var(--text-sm); }
.notif-item b { font-weight: 700; }
.notif-item span { display: block; color: var(--color-text-faint); font-size: var(--text-xs); }

.toast {
  position: fixed; bottom: calc(var(--space-16) + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  background: var(--color-text); color: var(--color-bg);
  padding: var(--space-2) var(--space-5); border-radius: var(--radius-full);
  font-size: var(--text-sm); z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 180ms ease;
}
.toast.show { opacity: 1; }

/* botão flutuante (mobile) */
#new-post-btn-mobile {
  position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: var(--radius-full);
  background: var(--color-primary); color: #fff; z-index: 40;
  box-shadow: var(--shadow-lg);
  display: none; align-items: center; justify-content: center;
}
@media (max-width: 899px) { #new-post-btn-mobile { display: flex; } }
@media (max-width: 899px) {
  body.chat-open #new-post-btn-mobile { display: none; }
}

/* tabs do feed (Para ti / A seguir) */
.feed-tabs { display: flex; gap: var(--space-2); margin-bottom: var(--space-6); max-width: var(--content-feed); margin-left: auto; margin-right: auto; }
.feed-tabs button {
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: 600;
  color: var(--color-text-muted); background: var(--color-surface-offset);
}
.feed-tabs button.active { background: var(--color-primary); color: #fff; }

/* stories viewer */
.story-viewer {
  position: fixed; inset: 0; z-index: 120; background: rgba(10, 8, 6, 0.95);
  display: grid; place-items: center;
}
.story-viewer img { max-height: 85dvh; max-width: 92vw; border-radius: var(--radius-lg); }
.story-viewer .close { position: absolute; top: var(--space-4); right: var(--space-4); color: #fff; font-size: var(--text-lg); }
</style>
</head>
<body>

<!-- Ecrã de entrada -->
<section id="login-view" class="login-hero">
  <div class="login-card">
    <a class="logo" href="#" onclick="return false;">
      <svg width="36" height="36" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
        <circle cx="16" cy="13" r="6" fill="#fff"/>
        <path d="M7 24c1.5-5 5-8 9-8s7.5 3 9 8" stroke="#fff" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="logo-text">Pic<em>alta</em></span>
    </a>
    <p class="login-tag">Fotos que contam histórias, conversas que aproximam.</p>

    <div id="auth-tabs" style="display:flex;gap:var(--space-2);margin-bottom:var(--space-4)">
      <button class="btn" style="flex:1;justify-content:center" id="tab-login">Entrar</button>
      <button class="btn ghost" style="flex:1;justify-content:center" id="tab-signup">Criar conta</button>
    </div>

    <form id="auth-form">
      <div class="field" id="field-name" style="display:none">
        <label for="auth-name">Nome</label>
        <input type="text" id="auth-name" placeholder="O teu nome" autocomplete="name" />
      </div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input type="email" id="auth-email" placeholder="teu@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="auth-password">Palavra-passe</label>
        <input type="password" id="auth-password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" required />
      </div>
      <p class="login-error" id="auth-error"></p>
      <button class="btn" type="submit" id="auth-submit" style="justify-content:center;width:100%">Entrar</button>
    </form>
    <p class="login-note" id="firebase-status" style="font-size:var(--text-xs);color:var(--color-text-faint);text-align:center;margin-top:var(--space-2)"></p>
  </div>
</section>

<!-- Aplicação -->
<div class="app" id="app-view" style="display:none">
  <aside class="sidebar">
    <a class="logo" href="#" data-nav="feed">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
        <circle cx="16" cy="13" r="6" fill="#fff"/>
        <path d="M7 24c1.5-5 5-8 9-8s7.5 3 9 8" stroke="#fff" stroke-width="2.5" fill="none"/>
      </svg>
      <span class="logo-text">Pic<em>alta</em></span>
    </a>
    <nav class="nav" aria-label="principal">
      <a href="#" data-nav="feed" class="active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        Feed
      </a>
      <a href="#" data-nav="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        Pesquisar
      </a>
      <a href="#" data-nav="explore">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg>
        Explorar
      </a>
      <a href="#" data-nav="chats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3 21l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
        Conversas
      </a>
      <a href="#" data-nav="profile">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-8 8-8s7 3 8 8"/></svg>
        Perfil
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn" id="new-post-btn" style="justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Nova publicação
      </button>
      <button class="btn ghost" id="new-story-btn" style="justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
        Nova história
      </button>
      <button class="btn ghost" id="tabbar-notif" style="justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notificações
      </button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Alternar modo claro/escuro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <span id="theme-label">Modo escuro</span>
      </button>
      <button class="btn ghost" id="logout-btn" style="justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Sair
      </button>
    </div>
  </aside>

  <main class="viewport">
    <div class="page-head mobile-only">
      <a class="logo" href="#" data-nav="feed">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="var(--color-primary)"/>
          <circle cx="16" cy="13" r="6" fill="#fff"/>
          <path d="M7 24c1.5-5 5-8 9-8s7.5 3 9 8" stroke="#fff" stroke-width="2.5" fill="none"/>
        </svg>
        <span class="logo-text">Pic<em>alta</em></span>
      </a>
      <div class="actions">
        <button class="icon-btn" id="notif-btn" aria-label="Notificações">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </div>

    <!-- Feed -->
    <section class="view active" id="view-feed">
      <div class="people-bar" id="people-bar" aria-label="pessoas"></div>
      <div class="feed-tabs">
        <button id="tab-feed-all" class="active">Para ti</button>
        <button id="tab-feed-following">A seguir</button>
      </div>
      <div class="feed" id="feed"></div>
    </section>

    <!-- Pesquisa -->
    <section class="view" id="view-search">
      <h2 class="page-title" style="margin-bottom:var(--space-6)">Pesquisar pessoas</h2>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Escreve um nome de utilizador…" autocomplete="off" />
      </div>
      <div class="search-results" id="search-results"></div>
    </section>

    <!-- Explorar -->
    <section class="view" id="view-explore">
      <h2 class="page-title" style="margin-bottom:var(--space-6)">Explorar pessoas</h2>
      <div class="suggestions-list" id="suggestions"></div>
    </section>

    <!-- Conversas -->
    <section class="view" id="view-chats">
      <div class="chat-layout">
        <div class="chat-list" id="chat-list"></div>
        <div class="chat-window" id="chat-window">
          <div class="chat-head">
            <button class="icon-btn" id="chat-back" aria-label="Voltar à lista" style="display:none">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
            </button>
            <div class="avatar-fallback" id="chat-avatar">?</div>
            <div>
              <b id="chat-name">—</b>
            </div>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-input" id="chat-input-form">
            <input type="text" id="chat-input" placeholder="Escreve uma mensagem…" autocomplete="off" />
            <button type="submit">Enviar</button>
          </form>
        </div>
      </div>
    </section>

    <!-- Perfil -->
    <section class="view" id="view-profile">
      <div class="profile-head">
        <div class="avatar-fallback" id="profile-avatar">?</div>
        <div>
          <h2 class="page-title" id="profile-name" style="margin-bottom:var(--space-2)">—</h2>
          <p style="font-size:var(--text-sm);color:var(--color-text-muted);margin-bottom:var(--space-3)" id="profile-bio"></p>
          <div class="profile-stats">
            <div><b id="stat-posts">0</b><span>publicações</span></div>
            <div><b id="stat-followers">0</b><span>seguidores</span></div>
            <div><b id="stat-following">0</b><span>a seguir</span></div>
          </div>
          <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3)" id="profile-actions"></div>
        </div>
      </div>
      <div class="profile-grid" id="profile-grid"></div>
    </section>
  </main>

  <button id="new-post-btn-mobile" aria-label="Nova publicação">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="navegação em telemóvel">
    <button data-nav="feed" class="active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
      Feed
    </button>
    <button data-nav="search">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      Pesquisar
    </button>
    <button data-nav="chats">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.6 0-3.1-.4-4.4-1.2L3 21l1.2-5.1A8.5 8.5 0 1 1 21 11.5z"/></svg>
      Conversas
    </button>
    <button id="tabbar-notif-mobile" aria-label="Notificações">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Notif.
    </button>
    <button data-nav="profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-8 8-8s7 3 8 8"/></svg>
      Perfil
    </button>
    <button id="tabbar-story" aria-label="Nova história">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M13 2v7h7"/></svg>
      História
    </button>
    <button id="tabbar-logout" aria-label="Sair">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Sair
    </button>
    <button id="tabbar-theme" aria-label="Alternar tema">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      Tema
    </button>
  </nav>
</div>

<!-- Modal de nova publicação -->
<div class="modal-backdrop" id="new-post-modal" style="display:none">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Nova publicação</h2>
    <label class="file-drop" for="post-file" id="file-drop">
      <span id="file-hint">Toca para escolher uma foto (JPG/PNG, até 3MB)</span>
    </label>
    <input type="file" id="post-file" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none" />
    <div class="field">
      <label for="post-caption">Legenda</label>
      <textarea id="post-caption" placeholder="Escreve algo sobre a foto…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-post">Cancelar</button>
      <button class="btn" id="publish-post">Publicar</button>
    </div>
  </div>
</div>

<!-- Modal de nova história -->
<div class="modal-backdrop" id="new-story-modal" style="display:none">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Nova história (24 horas)</h2>
    <label class="file-drop" for="story-file" id="story-file-drop">
      <span id="story-file-hint">Toca para escolher uma foto (desaparece após 24h)</span>
    </label>
    <input type="file" id="story-file" accept="image/png,image/jpeg,image/webp" style="display:none" />
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-story">Cancelar</button>
      <button class="btn" id="publish-story">Publicar história</button>
    </div>
  </div>
</div>

<!-- Modal de editar perfil -->
<div class="modal-backdrop" id="edit-profile-modal" style="display:none">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Editar perfil</h2>
    <label class="file-drop" for="avatar-file" id="avatar-file-drop">
      <span id="avatar-file-hint">Toca para escolher uma foto de perfil</span>
    </label>
    <input type="file" id="avatar-file" accept="image/png,image/jpeg,image/webp" style="display:none" />
    <div class="field">
      <label for="edit-name">Nome</label>
      <input type="text" id="edit-name" placeholder="O teu nome" />
    </div>
    <div class="field">
      <label for="edit-bio">Bio</label>
      <textarea id="edit-bio" placeholder="Fala de ti…"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-edit">Cancelar</button>
      <button class="btn" id="save-edit">Guardar</button>
    </div>
  </div>
</div>

<!-- Painel de notificações -->
<div class="notifications-panel" id="notifications-panel" aria-hidden="true">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-4)">
    <b>Notificações</b>
    <button class="icon-btn" id="close-notifs" aria-label="Fechar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div id="notifications-list"></div>
</div>

<!-- Visualizador de história -->
<div class="story-viewer" id="story-viewer" style="display:none">
  <button class="close" id="close-story" aria-label="Fechar">×</button>
  <img id="story-img" src="" alt="história" />
</div>

<div class="toast" id="toast" role="status"></div>

<script src="firebase.js"></script>
<script src="auth.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
